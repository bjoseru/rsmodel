[project]
name = "rsmodel"
description = "A resilience-symptom (RS) dynamical model of depression"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Björn S. Rüffer" },
    { name = "Michael Schönlein" },
]
maintainers = [
    { name = "Björn S. Rüffer", email = "bjoern.rueffer@gmail.com" },
]
keywords = [
    "depression",
    "resilience",
    "dynamical-systems",
    "mathematical-psychology",
    "ordinary-differential-equations",
    "stability-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "sympy>=1.12",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/bjoseru/rsmodel"
Repository = "https://github.com/bjoseru/rsmodel"
Issues = "https://github.com/bjoseru/rsmodel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "rsmodel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rsmodel"]

[tool.hatch.build.targets.sdist]
include = ["rsmodel", "README.md", "LICENSE"]
