name: Deploy playground

# Builds the WebAssembly export of notebooks/interactive_playground.py and
# publishes it to Cloudflare Pages (project "rsmodel", custom domain rsmodel.org).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   scoped to: Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL
# Nothing secret is ever committed to this repository.

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "rsmodel/rsmodel/**"
      - "tools/export_playground.py"
      - "web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      # --execute renders the notebook outputs into index.html, so a visitor
      # sees figures and text even if Pyodide never boots.
      - name: Build the static site
        run: uv run tools/export_playground.py --execute --no-hint -o build/site

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=rsmodel --branch=main
